apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: songs-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /songs/$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1/songs(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: songs-service
                port:
                  number: 8081

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: resources-ingress
  namespace: {{ .Values.namespace }}
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /resources/$2
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api/v1/resources(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: resources-service
                port:
                  number: 8080