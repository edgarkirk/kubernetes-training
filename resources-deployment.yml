apiVersion: apps/v1
kind: Deployment
metadata:
  name: resources-service-deployment
  namespace: k8s-program
spec:
  replicas: 2
  selector:
    matchLabels:
      app: resources-service
  template:
    metadata:
      labels:
        app: resources-service
    spec:
      containers:
        - name: resources-service
          image: ekirkilevics/resources-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: RESOURCES_MS_NAME
              value: "resources-ms"
            - name: RESOURCES_MS_PORT
              value: "8080"
            - name: SONGS_MS_URL
              value: "songs-service"
            - name: SONGS_MS_PORT
              value: "8081"
            - name: RESOURCES_DB_URL
              value: "resources-db"
            - name: RESOURCES_DB_PORT
              value: "5432"
            - name: ENABLE_EUREKA_CLIENT
              value: "false"
            - name: EUREKA_URI
              value: "localhost"